<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="utils.js"></script>
    <script src="script.js" defer></script>
    <title>Webshop</title>
</head>
<body>
    <main>
        <div class="menu">
            <h1>Our products</h1>
            <ul class="items" id="items">
                <li>
                    <div class="itemphoto">
                        <h2>Photo</h2>
                    </div>
                    <div class="itemname">
                        <h2>Title</h2>
                    </div>
                    <div class="itemprice">
                        <h2>Price</h2>
                    </div>
                    <div class="itemadd">
                        <h2></h2>
                    </div>
                </li>
            </ul>
        </div>
        <div class="menu">
            <h1>Cart</h1>
            <ul class="items" id="cart">
                <li>
                    <div class="itemname">
                        <h2>Title</h2>
                    </div>
                    <div class="itemprice">
                        <h2>Price</h2>
                    </div>
                </li>
            </ul>
            <p id="price">Total price: </p>
        </div>
    </main>
</body>
</html>
